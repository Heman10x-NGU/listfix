<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listfix — AI-Powered Listing Optimizer</title>
  <meta name="description" content="Paste your Facebook Marketplace listing, get AI-optimized title, description, and pricing to sell faster.">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Listfix — AI-Powered Listing Optimizer">
  <meta property="og:description" content="Paste your Facebook Marketplace listing, get AI-optimized title, description, and pricing to sell faster.">
  <meta property="og:image" content="/static/og-image.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Listfix — AI-Powered Listing Optimizer">
  <meta name="twitter:description" content="Paste your Facebook Marketplace listing, get AI-optimized title, description, and pricing to sell faster.">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#0a0a0f',
            'surface-1': '#12121a',
            'surface-2': '#1a1a26',
            accent: '#6366f1',
            'accent-hover': '#818cf8',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/static/style.css">

  <!-- App Logic -->
  <script src="/static/app.js" defer></script>
</head>
<body class="bg-surface text-white font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="w-full py-6 px-6 md:px-12">
    <div class="max-w-5xl mx-auto flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-9 h-9 rounded-xl bg-accent flex items-center justify-center text-white font-bold text-lg tracking-tight transition-transform duration-200 group-hover:scale-105">
          L
        </div>
        <span class="text-xl font-semibold tracking-tight">Listfix</span>
      </a>
      <span class="text-xs font-medium text-white/40 bg-white/5 border border-white/10 rounded-full px-3 py-1.5">
        Free &bull; No signup required
      </span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col items-center justify-start px-6 md:px-12 pt-8 md:pt-16 pb-24">

    <!-- Hero Section -->
    <section class="max-w-3xl mx-auto text-center mb-16">
      <h1 class="text-4xl md:text-6xl font-bold tracking-tight leading-[1.1] mb-6 text-balance">
        Sell faster with
        <span class="text-gradient">AI-optimized</span>
        listings
      </h1>
      <p class="text-lg md:text-xl text-white/50 max-w-xl mx-auto leading-relaxed">
        Paste your Facebook Marketplace listing below. Get an optimized title, description, and price suggestion in seconds.
      </p>
    </section>

    <!-- Input Section -->
    <section class="w-full max-w-2xl mx-auto mb-8">
      <div class="relative group">
        <div class="absolute -inset-px rounded-2xl bg-gradient-to-b from-accent/20 to-transparent opacity-0 group-focus-within:opacity-100 transition-opacity duration-300 pointer-events-none"></div>
        <textarea
          id="listing-input"
          rows="6"
          placeholder="Paste your listing here...&#10;&#10;e.g., &quot;Selling my iPhone 14 Pro, used for 6 months, works perfectly, comes with case and charger. Asking $750 OBO.&quot;"
          class="w-full bg-surface-1 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/25 text-base leading-relaxed resize-none focus:outline-none focus:border-accent/50 focus:ring-1 focus:ring-accent/20 transition-all duration-200"
        ></textarea>
      </div>

      <button
        id="analyze-btn"
        class="mt-4 w-full md:w-auto px-8 py-3.5 bg-accent hover:bg-accent-hover text-white font-medium rounded-xl transition-all duration-200 hover:shadow-lg hover:shadow-accent/20 active:scale-[0.98] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:shadow-none disabled:active:scale-100 flex items-center justify-center gap-2"
      >
        <span id="btn-text">Analyze with AI</span>
        <div id="btn-spinner" class="hidden">
          <div class="spinner"></div>
        </div>
      </button>
    </section>

    <!-- Results Section (Hidden Initially) -->
    <section id="results" class="w-full max-w-2xl mx-auto hidden">
      <div class="glass-card rounded-2xl p-6 md:p-8 space-y-8">

        <!-- Score Gauge -->
        <div class="flex flex-col items-center">
          <div class="score-gauge relative w-32 h-32">
            <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
              <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
              <circle id="score-ring" cx="60" cy="60" r="52" fill="none" stroke="url(#score-gradient)" stroke-width="8" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" class="score-ring"/>
              <defs>
                <linearGradient id="score-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="100%" stop-color="#a78bfa"/>
                </linearGradient>
              </defs>
            </svg>
            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <span id="score-value" class="text-3xl font-bold">0</span>
              <span class="text-xs text-white/40 mt-0.5">Score</span>
            </div>
          </div>
        </div>

        <!-- Suggestions -->
        <div id="suggestions" class="space-y-4">
          <!-- Populated by JS -->
        </div>

        <!-- Optimized Listing -->
        <div class="space-y-4">
          <h3 class="text-sm font-medium text-white/40 uppercase tracking-wider">Optimized Listing</h3>

          <!-- Title -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium text-white/60">Title</label>
              <button class="copy-btn text-xs text-white/40 hover:text-white/80 flex items-center gap-1.5 transition-colors" data-target="opt-title">
                <svg class="copy-icon w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke-width="2"/></svg>
                <svg class="check-icon w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                <span class="copy-label">Copy</span>
              </button>
            </div>
            <p id="opt-title" class="text-lg font-medium leading-snug bg-surface-2 border border-white/5 rounded-xl px-4 py-3"></p>
          </div>

          <!-- Description -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium text-white/60">Description</label>
              <button class="copy-btn text-xs text-white/40 hover:text-white/80 flex items-center gap-1.5 transition-colors" data-target="opt-desc">
                <svg class="copy-icon w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke-width="2"/></svg>
                <svg class="check-icon w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                <span class="copy-label">Copy</span>
              </button>
            </div>
            <p id="opt-desc" class="text-sm leading-relaxed text-white/70 bg-surface-2 border border-white/5 rounded-xl px-4 py-3 whitespace-pre-wrap"></p>
          </div>

          <!-- Price -->
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-sm font-medium text-white/60">Suggested Price</label>
              <button class="copy-btn text-xs text-white/40 hover:text-white/80 flex items-center gap-1.5 transition-colors" data-target="opt-price">
                <svg class="copy-icon w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2" stroke-width="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke-width="2"/></svg>
                <svg class="check-icon w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
                <span class="copy-label">Copy</span>
              </button>
            </div>
            <p id="opt-price" class="text-2xl font-bold text-accent-hover"></p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="w-full py-8 px-6 md:px-12 border-t border-white/5">
    <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-sm text-white/30">
      <span>Built with MiMo AI &bull; Open source</span>
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-white/60 transition-colors flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </a>
    </div>
  </footer>

</body>
</html>
